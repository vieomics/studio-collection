name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed studios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      studios: ${{ steps.changed.outputs.studios }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed studio folders
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t STUDIOS < <(
            find . -mindepth 2 -maxdepth 2 -name Makefile -printf '%h\n' \
              | sed 's|^\./||' \
              | sort -u
          )

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SELECTED=("${STUDIOS[@]}")
          else
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              BASE="${{ github.event.pull_request.base.sha }}"
              HEAD="${{ github.event.pull_request.head.sha }}"
            else
              BASE="${{ github.event.before }}"
              HEAD="${{ github.sha }}"
            fi

            if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then
              BASE=$(git merge-base origin/main "$HEAD" 2>/dev/null || true)
            fi

            if [[ -n "$BASE" ]]; then
              CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
            else
              CHANGED=$(git show --pretty=format: --name-only "$HEAD" || true)
            fi

            SELECTED=()
            for studio in "${STUDIOS[@]}"; do
              if grep -q "^${studio}/" <<< "$CHANGED"; then
                SELECTED+=("$studio")
              fi
            done

            if grep -q '^\.github/workflows/' <<< "$CHANGED"; then
              SELECTED=("${STUDIOS[@]}")
            fi
          fi

          if [[ ${#SELECTED[@]} -eq 0 ]]; then
            JSON='[]'
          else
            JSON=$(printf '%s\n' "${SELECTED[@]}" | jq -R . | jq -s -c .)
          fi

          echo "studios=$JSON" >> "$GITHUB_OUTPUT"
          echo "Changed studios: $JSON"

  build-and-test:
    name: build-and-test (${{ matrix.studio }})
    needs: changes
    if: needs.changes.outputs.studios != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        studio: ${{ fromJSON(needs.changes.outputs.studios) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start container
        working-directory: ${{ matrix.studio }}
        run: make start
        env:
          DOCKER_BUILDKIT: 1

      - name: Test image
        working-directory: ${{ matrix.studio }}
        run: make test

      - name: Stop container
        if: always()
        working-directory: ${{ matrix.studio }}
        run: make stop

  publish:
    name: publish (${{ matrix.studio }})
    needs:
      - changes
      - build-and-test
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'publish-docker'))
    runs-on: ubuntu-latest
    environment: PROD
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        studio: ${{ fromJSON(needs.changes.outputs.studios) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        working-directory: ${{ matrix.studio }}
        run: make dev
        env:
          DOCKER_BUILDKIT: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        working-directory: ${{ matrix.studio }}
        run: make publish
