name: studio-code-server

services:
  code-server:
    build:
      context: .
      args:
        STUDIO_VERSION: ${STUDIO_VERSION:-4.143.1}
        PIXI_VERSION: ${PIXI_VERSION:-0.83.0}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-2.2.0}
        NFCORE_EXTENSIONPACK_VERSION: ${NFCORE_EXTENSIONPACK_VERSION:-0.8.0}
    image: studio-collection/code-server:${STUDIO_VERSION:-4.143.1}
    container_name: studio-code-server
    environment:
      TZ: ${TZ:-Etc/UTC}
    ports:
      - "${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ./data:/home/coder
    restart: unless-stopped
